# .github/workflows/nightly.yml -- the website's nightly run (L-485, the
# gallery half).
#
# What it is. GitHub's computers run the night form of the Daily Run
# every night, with nobody at the keyboard: the pulls from the orrery,
# the cache build, the run records check and every offline checker, then
# one gate. On a clean night it commits the files those tools wrote, and
# nothing else, and pushes them; GitHub Pages then redeploys the site in
# its own run. Tony's rulings of 2026-10-25, in the orrery's
# documentation/DESIGN_L485_nightly_run_rulings_20261025.md: R1, the
# checkers are the gate and the commit touches only what the tools
# write; R3, it runs on GitHub's computers; R4, an outside failure is
# reported, never halting the next night. The guest book is not in the
# night: it needs Tony's answers and stays his morning's (his ruling of
# Oct 31, 2026, 10:20).
#
# The gate is the Daily Run's own. `python daily_run.py --night` exits 0
# only on a clean night (its docstring, THE NIGHT FORM, lists the seven
# conditions). Any other exit fails this job before the commit step, so
# a red night commits nothing and the site keeps serving the previous
# cache. The log of every run, red or clean, is kept under the
# repository's Actions tab; on a red night it is the only record.
#
# THE HOUR GAP IS A HOPE, NOT A RULE. The orrery's own nightly run is at
# 07:17 UTC and this one an hour later, so this one usually pulls what
# the orrery pushed that night. But GitHub delays a scheduled run without
# bounding the delay ("The schedule event can be delayed during periods
# of high loads"), and the orrery's first scheduled run started 6 hours
# 22 minutes late. This run pulls whatever the orrery's GitHub copy holds
# when it starts -- at worst the previous night's exports, well inside
# the thirty-day margin -- and never waits for the orrery's run. Do NOT
# "fix" this by chaining the two: chaining needs a credential shared
# between the repositories, which is one more thing to create, store and
# renew, and the design chose against it (P3).
#
# Fire it by hand: the Actions tab, "Nightly run", "Run workflow".
#
# Written October 31, 2026 with Anthropic's Claude Opus 5.5 (L-485, the
# gallery half), modelled on the orrery's .github/workflows/nightly.yml.

name: Nightly run

on:
  schedule:
    # 08:17 UTC every day: 3:17 am in Chicago until the clocks change on
    # November 1, 2026, 2:17 am after. The hour is Tony's (2026-10-29,
    # 23:36: the orrery at 7 UTC, the website at 8 UTC). The minute is
    # off the hour because GitHub's documentation says "High load times
    # include the start of every hour" and "schedule your workflow to run
    # at a different time of the hour".
    - cron: '17 8 * * *'
  workflow_dispatch:

# A run by hand and the scheduled run must never overlap, since both
# push. GitHub's page "Control the concurrency of workflows and jobs",
# read 2026-10-31: "When a concurrent job or workflow is queued, if
# another job or workflow using the same concurrency group in the
# repository is in progress, the queued job or workflow will be
# pending." So a second run waits for the first. cancel-in-progress is
# left off on purpose: a running night is never cut off mid-build. (The
# same page: "any existing pending job or workflow in the same
# concurrency group will be canceled and the new queued job or workflow
# will take its place" -- so at most one waits, which is what we want.)
concurrency:
  group: nightly-run

permissions:
  contents: write   # commit and push the night's files
  actions: write    # the keep-alive step below re-enables this workflow

jobs:
  night:
    # Named, not ubuntu-latest, as the orrery's is: GitHub's image page
    # says ubuntu-latest moves to Ubuntu 26.04 in November 2026, and a new
    # system under a run in its first week would be a second thing
    # changing at once. GitHub's software list for this image (version
    # 20261026.354.1, read 2026-10-31) carries "Node.js 22.23.4", which
    # the smoke suites need (each requires only fs and path), "Git
    # 2.56.0" and "GitHub CLI 2.103.2"; so no setup-node step and no
    # browser.
    runs-on: ubuntu-24.04
    steps:
      # main as it stands when this job starts, not the commit the run
      # was started at: a run that waited behind another (concurrency,
      # above) then builds on the night the first one pushed, and its own
      # push is not refused as out of date.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python 3.13 (requirements.txt's recommended version)
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install the builder's libraries
        run: python -m pip install -r requirements.txt

      # The pulls ask GitHub's interface for the orrery's newest commit.
      # Unsigned, that is limited by an address GitHub's runners share;
      # with the run's own token it is not ("The rate limit for
      # GITHUB_TOKEN is 1,000 requests per hour per repository", GitHub's
      # "Rate limits for the REST API"). GitHub does not put the token in
      # a step's environment by itself, so it is handed over here.
      - name: The night (python daily_run.py --night)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python daily_run.py --night

      - name: Commit and push the night's files
        run: |
          # Only the allow-list is added, read from the Daily Run itself,
          # so the list has one home: the tools' declared outputs, the
          # served cache whole (deletions included, under the gate's
          # deletions-only guard), the swap log and the night's record.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python daily_run.py --allow-list | tr -d '\r' | while read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              */) git add -A -- "$path" ;;
              *) if [ -e "$path" ]; then git add -- "$path"; fi ;;
            esac
          done
          # Anything git still sees changed or new is outside the
          # allow-list: fail, naming it, and commit nothing.
          left=$(git status --porcelain --untracked-files=all | grep -v '^[MADRC] ' || true)
          if [ -n "$left" ]; then
            echo "NIGHT COMMIT: REFUSED -- changed outside the allow-list:"
            echo "$left"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "NIGHT COMMIT: nothing changed, nothing committed"
            exit 0
          fi
          count=$(git diff --cached --name-only | wc -l)
          named=$(git diff --cached --name-only | grep -v '^data/solar-system/' | tr '\n' ' ')
          served=$(git diff --cached --name-only | grep -c '^data/solar-system/' || true)
          day=$(date -u +%Y-%m-%d)
          git commit -m "Nightly run $day UTC: $named and $served files under data/solar-system/" \
                     -m "Written by .github/workflows/nightly.yml (L-485, the gallery half): the night ran clean, and these $count files are what its tools wrote."
          git push
          echo "NIGHT COMMIT: pushed $(git rev-parse HEAD): $count files ($named + $served under data/solar-system/)"

      # The keep-alive (L-490, the legacy list), as the orrery's. GitHub's
      # documentation: "In a public repository, scheduled workflows are
      # automatically disabled when no repository activity has occurred in
      # 60 days." It does not say what counts as activity, so this run
      # does not lean on its own commits counting. Each night, clean or
      # red, it asks GitHub to enable this workflow. Whether that resets
      # GitHub's count is not written down either; and a workflow already
      # paused does not run, so it cannot revive itself. Both are on L-490.
      - name: Keep the schedule alive (L-490)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable nightly.yml
