<!DOCTYPE html>
<!--
  solar_system_earth_test.html - Phase 2 artifact 1 (Earth alone) Mode 5 render harness.

  THROWAWAY DEV PAGE, not the shipped exhibit. Runs the `assembler` package in
  the browser via Pyodide, fetches the REAL served cache
  (../data/solar-system/coverage_index.json, ../data/objects_config.json),
  calls assemble_scene at the date chosen in the picker, and renders the
  resulting Plotly figure dict with Plotly.js. The in-browser L-080 fingerprint
  is shown for comparison against the CPython golden
  (artifact_1_earth_alone.json -> abbd01094852b57f, at epoch 2026-07-13).

  Dark theme + cube axes + orthographic top-down camera come from the figure
  layout (assembler presentation.build_layout), matching palomas_orrery.py's
  build_scene. Feature rendering stays JavaScript and now EXISTS: the report's
  feature dispatch is drawn by feature_renderers.js (L-154, August 2026), so
  Earth's atmosphere and belts, and Jupiter's and Saturn's rings, render here.
  The scene selector chooses artifact 1 (Earth alone, the fingerprinted one)
  or the artifact 2 candidate (Jupiter + Saturn), UNFINGERPRINTED -- drawing is
  not locking. The "Frame on" control ranges the axes around one body, because
  a ring system is three orders of magnitude smaller than the orbit it rides on.
  Pyodide loads lazily on the button (master plan
  S5/S7 consent/lazy gate). Assembler is pure stdlib: no numpy, no plotly-Python.

  MUST BE SERVED OVER HTTP (not file://) so fetch() of local assembler/ and
  data/ works. From the repo root:
      python -m http.server 8000
  then open  http://localhost:8000/gallery/solar_system_earth_test.html

  Page created: July 2026 with Anthropic's Claude Opus 4.8 (Phase 2 artifact 1).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paloma's Orrery - Solar System (Earth test)</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<!-- L-154: client-side feature renderers (rings, belts, shells). -->
<script src="feature_renderers.js"></script>
<style>
  :root { --bg:#000; --panel:#0d1016; --ink:#f4f6fb; --muted:#9aa0a6;
          --line:#2a2f3a; --accent:#3b7ddd; }
  html, body { background: var(--bg); }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         color: var(--ink); margin: 0; padding: 24px; max-width: 1150px; }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .controls { display: flex; gap: 14px; align-items: flex-end;
              flex-wrap: wrap; margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: var(--muted);
          margin-bottom: 4px; }
  input[type="date"] { font: inherit; padding: 8px 10px; border-radius: 6px;
          border: 1px solid var(--line); background: var(--panel);
          color: var(--ink); color-scheme: dark; }
  button { font: inherit; padding: 9px 18px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; border-radius: 6px;
           cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #plot { width: 100%; height: 640px; margin-top: 14px; background: var(--bg);
          border: 1px solid var(--line); border-radius: 8px; }
  #log { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
         color: var(--muted); white-space: pre-wrap; margin-top: 14px;
         border-top: 1px solid var(--line); padding-top: 10px; }
  .ok { color: #57d18a; } .err { color: #ff6b6b; }
  details { margin-top: 12px; font-size: 12px; color: var(--muted); }
  pre { background: var(--panel); padding: 10px; border-radius: 6px;
        overflow: auto; color: var(--ink); }
</style>
</head>
<body>
  <h1>Paloma's Orrery</h1>
  <p class="sub">Solar System - Earth test (Phase 2 artifact 1). Renders the
     assembler's figure dict in the browser. Dev harness, not the shipped page.</p>

  <div class="controls">
    <div>
      <label for="epoch">Date (UTC)</label>
      <input type="date" id="epoch" value="2026-07-13">
    </div>
    <div>
      <label for="scene">Scene</label>
      <select id="scene">
        <option value="earth" selected>Earth alone (artifact 1)</option>
        <option value="jupiter,saturn">Jupiter + Saturn (artifact 2 candidate)</option>
      </select>
    </div>
    <div>
      <label for="frame">Frame on</label>
      <select id="frame">
        <option value="" selected>Whole scene</option>
      </select>
    </div>
    <button id="run">Render</button>
  </div>

  <div id="plot"></div>
  <div id="log"></div>
  <details id="fpwrap" hidden>
    <summary>In-browser L-080 fingerprint (matches golden abbd01094852b57f at 2026-07-13)</summary>
    <pre id="fp"></pre>
  </details>

<script>
const ASSEMBLER_FILES = [
  "assembler/__init__.py",
  "assembler/errors.py",
  "assembler/models.py",
  "assembler/catalog.py",
  "assembler/cache_reader.py",
  "assembler/render_orbits.py",
  "assembler/render_objects.py",
  "assembler/render_spacecraft.py",
  "assembler/render_events.py",
  "assembler/resolver.py",
  "assembler/presentation.py",
  "assembler/assemble.py",
  "assembler/harness/__init__.py",
  "assembler/harness/fingerprint.py",
];

// Match the Pyodide version already confirmed working in measure_plotly.html.
const PYODIDE_BASE = "https://cdn.jsdelivr.net/pyodide/v314.0.2/full/";
let PY = null;  // cache the runtime across re-renders (date changes)

const logEl = document.getElementById("log");
function log(msg, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
}

function loadPyodideScript() {
  return new Promise((resolve, reject) => {
    if (window.loadPyodide) { resolve(); return; }
    const s = document.createElement("script");
    s.src = PYODIDE_BASE + "pyodide.js";
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Failed to load pyodide.js from " + PYODIDE_BASE));
    document.head.appendChild(s);
  });
}

/* Axis framing. Ranges stay equal-span on all three axes so aspectmode
   "cube" still shows undistorted geometry, and gridDtick mirrors the
   assembler's calculate_grid_dtick (1/2/5 x 10^n, about six gridlines). */
function gridDtick(span) {
  if (span <= 0) return 1;
  const raw = span / 6;
  const exp = Math.floor(Math.log10(raw));
  const mant = raw / Math.pow(10, exp);
  const clean = mant < 1.5 ? 1 : mant < 3.5 ? 2 : mant < 7.5 ? 5 : 10;
  return clean * Math.pow(10, exp);
}

function rebuildFrameOptions(bodies) {
  const sel = document.getElementById("frame");
  const keep = sel.value;
  sel.innerHTML = "";
  const whole = document.createElement("option");
  whole.value = ""; whole.textContent = "Whole scene";
  sel.appendChild(whole);
  Object.keys(bodies).forEach(function (slug) {
    const o = document.createElement("option");
    o.value = slug; o.textContent = bodies[slug].name;
    sel.appendChild(o);
  });
  sel.value = bodies[keep] ? keep : "";
}

function frameLayout(layout, featureTraces, bodies, slug) {
  if (!slug || !bodies[slug]) return layout;
  const c = bodies[slug].position;
  const prefix = bodies[slug].name + ":";
  let half = 0;
  featureTraces.forEach(function (t) {
    if (!t.name || t.name.indexOf(prefix) !== 0 || !t.x) return;
    // L-234: a shell hidden behind a legend click is not part of what
    // is on screen, so it must not set the frame. Framing on the Sun
    // would otherwise range the axes to the Oort cloud.
    if (t.visible === "legendonly") return;
    for (let i = 0; i < t.x.length; i++) {
      half = Math.max(half, Math.abs(t.x[i] - c[0]), Math.abs(t.y[i] - c[1]),
                      Math.abs(t.z[i] - c[2]));
    }
  });
  if (half <= 0) {
    log("Frame on " + bodies[slug].name + ": no feature geometry to frame; "
        + "left at whole-scene range.");
    return layout;
  }
  half *= 1.2;
  const out = JSON.parse(JSON.stringify(layout));
  const dtick = gridDtick(2 * half);
  ["xaxis", "yaxis", "zaxis"].forEach(function (ax, i) {
    out.scene[ax].range = [c[i] - half, c[i] + half];
    out.scene[ax].dtick = dtick;
    out.scene[ax].autorange = false;
  });
  out.scene.aspectmode = "cube";
  log("Framed on " + bodies[slug].name + ": half-span "
      + half.toPrecision(3) + " AU, dtick " + dtick.toPrecision(3) + " AU.");
  return out;
}

async function fetchText(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("fetch " + url + " -> HTTP " + r.status);
  return await r.text();
}

const DRIVER = `
import json
import sys
sys.path.insert(0, "/home/pyodide")

from assembler.catalog import Catalog
from assembler.cache_reader import CacheReader
from assembler.assemble import assemble_scene
from assembler.harness import fingerprint as fp
from assembler import render_orbits

cov = json.loads(COV_JSON)
cfg = json.loads(CFG_JSON)

slugs = [s for s in OBJECTS.split(",") if s]
scene = {
    "spec_version": "1.0", "domain": "solar_system", "content_type": "static",
    "objects": slugs, "center": "sun", "epoch": EPOCH,
}
result = assemble_scene(scene, Catalog(cfg), CacheReader(cov))

artifact_id = ("artifact_1_earth_alone" if slugs == ["earth"]
               else "artifact_2_candidate_" + "_".join(slugs))
golden = fp.fingerprint(artifact_id, result)

# Where each object sits at the resolved epoch. The feature renderers need a
# centre to offset to; assemble.py already computes this for the position
# marker but does not report it, so it is recomputed here through the same
# function rather than scraped back out of the figure.
bodies = {}
for o in result.context.objects:
    if not o.osculating:
        continue
    px, py, pz = render_orbits.propagate_marker(
        o.osculating, result.context.resolved_epoch_jd)
    bodies[o.slug] = {"name": o.name, "position": [px, py, pz]}

# L-234: the scene CENTER is not in context.objects -- it has no orbit in
# its own frame -- so it never reached the bodies map and every feature
# dispatched for it warned "no propagated position available". It sits at
# the origin by definition.
center_slug = result.context.center
if center_slug not in bodies:
    center_cfg = next((o for o in cfg["objects"]
                       if o["slug"] == center_slug), None)
    if center_cfg is not None:
        bodies[center_slug] = {"name": center_cfg["name"],
                               "position": [0.0, 0.0, 0.0]}

json.dumps({
    "figure": result.figure,
    "fingerprint": golden,
    "artifact_id": artifact_id,
    "warnings": result.report["warnings"],
    "features": result.report["features"],
    "bodies": bodies,
})
`;

async function ensureRuntime() {
  if (PY) return PY;
  log("Loading Pyodide runtime (from CDN)...");
  await loadPyodideScript();
  PY = await loadPyodide({ indexURL: PYODIDE_BASE });
  log("Pyodide ready.", "ok");

  log("Fetching assembler package (" + ASSEMBLER_FILES.length + " files)...");
  PY.FS.mkdirTree("/home/pyodide/assembler/harness");
  for (const rel of ASSEMBLER_FILES) {
    PY.FS.writeFile("/home/pyodide/" + rel, await fetchText(rel));
  }
  log("Assembler written to Pyodide FS.", "ok");

  log("Fetching served cache (../data/) ...");
  PY.globals.set("COV_JSON", await fetchText("../data/solar-system/coverage_index.json"));
  PY.globals.set("CFG_JSON", await fetchText("../data/objects_config.json"));
  log("Served cache loaded.", "ok");
  return PY;
}

async function run() {
  const btn = document.getElementById("run");
  btn.disabled = true;
  try {
    const py = await ensureRuntime();

    const date = document.getElementById("epoch").value || "2026-07-13";
    const epoch = date + "T00:00:00Z";
    const objects = document.getElementById("scene").value;
    py.globals.set("EPOCH", epoch);
    py.globals.set("OBJECTS", objects);

    log("Running assemble_scene(" + objects + ", " + epoch + ") in the browser...");
    const payload = JSON.parse(await py.runPythonAsync(DRIVER));
    log("Assembly complete: " + payload.figure.data.length + " orbit traces.", "ok");

    // The scene half-range decides which shells start hidden: anything
    // bigger than the scene is created visible:"legendonly" (L-234).
    const sceneRange = ((payload.figure.layout.scene || {}).xaxis || {}).range;
    const halfRangeAu = Array.isArray(sceneRange)
      ? Math.max(Math.abs(sceneRange[0]), Math.abs(sceneRange[1])) : null;
    const feat = GalleryFeatures.buildFeatureTraces(payload.features,
                                                    payload.bodies,
                                                    {sceneHalfRangeAu: halfRangeAu});
    feat.warnings.forEach(w => log("feature: " + w, "err"));
    log("Features: " + feat.traces.length + " traces from "
        + payload.features.length + " requests.",
        feat.warnings.length ? "err" : "ok");

    rebuildFrameOptions(payload.bodies);
    const layout = frameLayout(payload.figure.layout, feat.traces,
                               payload.bodies,
                               document.getElementById("frame").value);

    Plotly.newPlot("plot", payload.figure.data.concat(feat.traces),
                   layout, {responsive: true});
    log("Rendered. This is the Mode 5 gate - your eyes decide.", "ok");
    log("Rings and belts are thousands of times smaller than the orbits. "
        + "At whole-scene range they are sub-pixel: pick a body under "
        + "Frame on and re-render to put the axes around it.");

    document.getElementById("fpwrap").hidden = false;
    document.getElementById("fp").textContent =
      JSON.stringify(payload.fingerprint, null, 2);
    if (payload.warnings && payload.warnings.length) {
      payload.warnings.forEach(w => log("warning: " + w));
    }
  } catch (e) {
    log("ERROR: " + e.message, "err");
    log("If this is a fetch/CORS error, serve over http "
        + "(python -m http.server) rather than opening the file directly.");
  } finally {
    btn.disabled = false;
  }
}
document.getElementById("run").addEventListener("click", run);
</script>
</body>
</html>
