<!DOCTYPE html>
<!--
  solar_system_earth_test.html - Phase 2 artifact 1 (Earth alone) Mode 5 render harness.

  THROWAWAY DEV PAGE, not the shipped exhibit. It runs the `assembler` package
  in the browser via Pyodide, fetches the REAL served cache
  (../data/solar-system/coverage_index.json, ../data/objects_config.json),
  calls assemble_scene, and renders the resulting Plotly figure dict with
  Plotly.js. The in-browser L-080 fingerprint is shown so it can be compared
  against the CPython golden (artifact_1_earth_alone.json -> abbd01094852b57f).

  Pyodide loads lazily on the button (master plan Section 5/7 consent/lazy
  gate). Plotly rendering is JavaScript; the Python assembler produces only a
  figure dict (no plotly-Python, no numpy).

  MUST BE SERVED OVER HTTP (not opened as file://) so fetch() of the local
  assembler/ and data/ files works. From the repo root:
      python -m http.server 8000
  then open  http://localhost:8000/gallery/solar_system_earth_test.html

  Page created: July 2026 with Anthropic's Claude Opus 4.8 (Phase 2 artifact 1).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar System - Earth test (Phase 2 artifact 1)</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  :root { --ink:#1a1d24; --muted:#5c6470; --line:#dfe3ea; --accent:#3b7ddd; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         color: var(--ink); margin: 0; padding: 24px; max-width: 1100px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  button { font: inherit; padding: 9px 16px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; border-radius: 6px;
           cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #plot { width: 100%; height: 620px; margin-top: 16px;
          border: 1px solid var(--line); border-radius: 8px; }
  #log { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
         color: var(--muted); white-space: pre-wrap; margin-top: 14px;
         border-top: 1px solid var(--line); padding-top: 10px; }
  .ok { color: #1a7f37; } .err { color: #b3261e; }
  details { margin-top: 12px; font-size: 12px; }
  pre { background: #f6f8fa; padding: 10px; border-radius: 6px; overflow: auto; }
</style>
</head>
<body>
  <h1>Solar System - Earth test</h1>
  <p class="sub">Phase 2 artifact 1 (Earth alone). Renders the assembler's
     figure dict in the browser. Dev harness, not the shipped page.</p>
  <button id="run">Render Earth</button>
  <div id="plot"></div>
  <div id="log"></div>
  <details id="fpwrap" hidden>
    <summary>In-browser L-080 fingerprint (compare to golden abbd01094852b57f)</summary>
    <pre id="fp"></pre>
  </details>

<script>
const ASSEMBLER_FILES = [
  "assembler/__init__.py",
  "assembler/errors.py",
  "assembler/models.py",
  "assembler/catalog.py",
  "assembler/cache_reader.py",
  "assembler/render_orbits.py",
  "assembler/render_objects.py",
  "assembler/render_spacecraft.py",
  "assembler/render_events.py",
  "assembler/resolver.py",
  "assembler/presentation.py",
  "assembler/assemble.py",
  "assembler/harness/__init__.py",
  "assembler/harness/fingerprint.py",
];

// Match the Pyodide version already confirmed working in measure_plotly.html.
const PYODIDE_BASE = "https://cdn.jsdelivr.net/pyodide/v314.0.2/full/";

function loadPyodideScript() {
  return new Promise((resolve, reject) => {
    if (window.loadPyodide) { resolve(); return; }
    const s = document.createElement("script");
    s.src = PYODIDE_BASE + "pyodide.js";
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Failed to load pyodide.js from " + PYODIDE_BASE));
    document.head.appendChild(s);
  });
}

const logEl = document.getElementById("log");
function log(msg, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
}

async function fetchText(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("fetch " + url + " -> HTTP " + r.status);
  return await r.text();
}

const DRIVER = `
import json
import sys
sys.path.insert(0, "/home/pyodide")

from assembler.catalog import Catalog
from assembler.cache_reader import CacheReader
from assembler.assemble import assemble_scene
from assembler.harness import fingerprint as fp

cov = json.loads(COV_JSON)
cfg = json.loads(CFG_JSON)

scene = {
    "spec_version": "1.0", "domain": "solar_system", "content_type": "static",
    "objects": ["earth"], "center": "sun", "epoch": "2026-07-13T00:00:00Z",
}
result = assemble_scene(scene, Catalog(cfg), CacheReader(cov))
golden = fp.fingerprint("artifact_1_earth_alone", result)

json.dumps({
    "figure": result.figure,
    "fingerprint": golden,
    "warnings": result.report["warnings"],
    "features": result.report["features"],
})
`;

async function run() {
  const btn = document.getElementById("run");
  btn.disabled = true;
  try {
    log("Loading Pyodide runtime (from CDN)...");
    await loadPyodideScript();
    const py = await loadPyodide({ indexURL: PYODIDE_BASE });
    log("Pyodide ready.", "ok");

    log("Fetching assembler package (" + ASSEMBLER_FILES.length + " files)...");
    py.FS.mkdirTree("/home/pyodide/assembler/harness");
    for (const rel of ASSEMBLER_FILES) {
      const text = await fetchText(rel);
      py.FS.writeFile("/home/pyodide/" + rel, text);
    }
    log("Assembler written to Pyodide FS.", "ok");

    log("Fetching served cache (../data/) ...");
    const cov = await fetchText("../data/solar-system/coverage_index.json");
    const cfg = await fetchText("../data/objects_config.json");
    py.globals.set("COV_JSON", cov);
    py.globals.set("CFG_JSON", cfg);
    log("Served cache loaded.", "ok");

    log("Running assemble_scene(earth) in the browser...");
    const payloadStr = await py.runPythonAsync(DRIVER);
    const payload = JSON.parse(payloadStr);
    log("Assembly complete: " + payload.figure.data.length + " traces.", "ok");

    Plotly.newPlot("plot", payload.figure.data, payload.figure.layout,
                   {responsive: true});
    log("Rendered. This is the Mode 5 gate - your eyes decide.", "ok");

    document.getElementById("fpwrap").hidden = false;
    document.getElementById("fp").textContent =
      JSON.stringify(payload.fingerprint, null, 2);
    if (payload.warnings && payload.warnings.length) {
      payload.warnings.forEach(w => log("warning: " + w));
    }
  } catch (e) {
    log("ERROR: " + e.message, "err");
    log("If this is a fetch/CORS error, serve over http "
        + "(python -m http.server) rather than opening the file directly.");
    document.getElementById("run").disabled = false;
  }
}
document.getElementById("run").addEventListener("click", run);
</script>
</body>
</html>
